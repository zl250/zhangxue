<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>连接数据库 | 知乎的模仿与创作</title>
  <meta name="description" content="张雪的知乎模仿项目：MySQL 数据库连接测试">
  <link rel="stylesheet" href="css/Zhang_index.css">
  <link rel="stylesheet" href="css/Zhang_database.css">
</head>
<body class="Zhang_body">
  <canvas id="Zhang_canvas" class="Zhang_canvas" aria-hidden="true"></canvas>
  <div class="Zhang_aurora Zhang_aurora--one" aria-hidden="true"></div>
  <div class="Zhang_aurora Zhang_aurora--two" aria-hidden="true"></div>

  <header class="Zhang_header">
    <div class="Zhang_header__brand">
      <span class="Zhang_logo">知</span>
      <span class="Zhang_header__name">知乎 · 模仿与创作</span>
    </div>
    <a class="Zhang_header__tag Zhang_header__link" href="index.html">返回首页</a>
  </header>

  <main class="Zhang_dbMain">
    <section class="Zhang_dbPanel" aria-labelledby="Zhang_dbTitle">
      <p class="Zhang_dbPanel__eyebrow">MYSQL CONNECTION</p>
      <h1 class="Zhang_dbPanel__title" id="Zhang_dbTitle">连接数据库</h1>
      <p class="Zhang_dbPanel__desc">
        输入 MySQL 账号信息，测试与本地数据库服务的连接状态。默认账号已自动填充。
      </p>

      <form class="Zhang_dbForm" id="Zhang_dbForm" autocomplete="off" novalidate>
        <label class="Zhang_field" for="Zhang_dbUser">
          <span class="Zhang_field__label">用户名</span>
          <input
            class="Zhang_field__input"
            type="text"
            id="Zhang_dbUser"
            name="username"
            value="root"
            placeholder="例如：root"
            autocomplete="username"
            required
          >
        </label>

        <label class="Zhang_field" for="Zhang_dbPass">
          <span class="Zhang_field__label">密码</span>
          <input
            class="Zhang_field__input"
            type="password"
            id="Zhang_dbPass"
            name="password"
            placeholder="请输入数据库密码"
            autocomplete="current-password"
            required
          >
        </label>

        <button class="Zhang_dbBtn" type="submit" id="Zhang_dbSubmit">
          <span class="Zhang_dbBtn__text">连接数据库</span>
        </button>
      </form>

      <div class="Zhang_status" id="Zhang_dbStatus" role="status" aria-live="polite" hidden></div>

      <dl class="Zhang_dbTips">
        <div class="Zhang_dbTips__item">
          <dt>服务地址</dt>
          <dd>localhost:3306</dd>
        </div>
        <div class="Zhang_dbTips__item">
          <dt>数据库类型</dt>
          <dd>MySQL 8.0</dd>
        </div>
      </dl>
    </section>
  </main>

  <footer class="Zhang_footer">
    <span>张雪 · 24001010727 · 知乎的模仿与创作</span>
    <span class="Zhang_footer__year">2026</span>
  </footer>

  <script src="js/Zhang_canvas.js"></script>
  <script src="js/Zhang_database.js"></script>
</body>
</html>
