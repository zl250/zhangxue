<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科技新闻 | 知乎的模仿与创作</title>
  <meta name="description" content="张雪的知乎模仿项目：科技新闻列表，数据来自 MySQL">
  <link rel="stylesheet" href="css/Zhang_index.css">
  <link rel="stylesheet" href="css/Zhang_news.css">
</head>
<body class="Zhang_body">
  <canvas id="Zhang_canvas" class="Zhang_canvas" aria-hidden="true"></canvas>
  <div class="Zhang_aurora Zhang_aurora--one" aria-hidden="true"></div>
  <div class="Zhang_aurora Zhang_aurora--two" aria-hidden="true"></div>

  <header class="Zhang_header">
    <div class="Zhang_header__brand">
      <span class="Zhang_logo">知</span>
      <span class="Zhang_header__name">知乎 · 模仿与创作</span>
    </div>
    <a class="Zhang_header__tag Zhang_header__link" href="index.html">返回首页</a>
  </header>

  <main class="Zhang_newsMain">
    <section class="Zhang_newsHero">
      <p class="Zhang_newsHero__eyebrow">TECH NEWS · MYSQL</p>
      <h1 class="Zhang_newsHero__title">科技新闻</h1>
      <p class="Zhang_newsHero__desc">
        页面数据全部来自 MySQL 数据表 <code class="Zhang_code">Zhang_news</code>，
        由 Express 接口实时读取后渲染。
      </p>

      <div class="Zhang_apiBar">
        <span class="Zhang_apiBar__method">GET</span>
        <a class="Zhang_apiBar__link" href="/api/news" target="_blank" rel="noopener">
          http://localhost:727/api/news
        </a>
        <span class="Zhang_apiBar__hint">点击查看原始 JSON</span>
      </div>
    </section>

    <section class="Zhang_newsSection" aria-labelledby="Zhang_newsTitle">
      <div class="Zhang_newsSection__head">
        <h2 class="Zhang_newsSection__title" id="Zhang_newsTitle">最新资讯</h2>
        <span class="Zhang_newsSection__count" id="Zhang_newsCount">加载中…</span>
      </div>

      <div class="Zhang_newsList" id="Zhang_newsList" aria-live="polite"></div>
    </section>
  </main>

  <footer class="Zhang_footer">
    <span>张雪 · 24001010727 · 知乎的模仿与创作</span>
    <span class="Zhang_footer__year">2026</span>
  </footer>

  <script src="js/Zhang_canvas.js"></script>
  <script src="js/Zhang_news.js"></script>
</body>
</html>
