<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科技图文 | 知乎的模仿与创作</title>
  <meta name="description" content="张雪的知乎模仿项目：科技图文列表，数据来自 MySQL">
  <link rel="stylesheet" href="css/Zhang_index.css">
  <link rel="stylesheet" href="css/Zhang_gallery.css">
</head>
<body class="Zhang_body">
  <canvas id="Zhang_canvas" class="Zhang_canvas" aria-hidden="true"></canvas>
  <div class="Zhang_aurora Zhang_aurora--one" aria-hidden="true"></div>
  <div class="Zhang_aurora Zhang_aurora--two" aria-hidden="true"></div>

  <header class="Zhang_header">
    <div class="Zhang_header__brand">
      <span class="Zhang_logo">知</span>
      <span class="Zhang_header__name">知乎 · 模仿与创作</span>
    </div>
    <a class="Zhang_header__tag Zhang_header__link" href="index.html">返回首页</a>
  </header>

  <main class="Zhang_galleryMain">
    <section class="Zhang_galleryHero">
      <p class="Zhang_galleryHero__eyebrow">PHOTO STORIES · MYSQL</p>
      <h1 class="Zhang_galleryHero__title">科技图文</h1>
      <p class="Zhang_galleryHero__desc">
        图片与文字均来自 MySQL 数据表 <code class="Zhang_code">Zhang_gallery</code>，
        由 Express 接口返回后渲染成图集。
      </p>

      <div class="Zhang_apiBar">
        <span class="Zhang_apiBar__method">GET</span>
        <a class="Zhang_apiBar__link" href="/api/gallery" target="_blank" rel="noopener">
          http://localhost:727/api/gallery
        </a>
        <span class="Zhang_apiBar__hint">点击查看原始 JSON</span>
      </div>
    </section>

    <section class="Zhang_gallerySection" aria-labelledby="Zhang_galleryTitle">
      <div class="Zhang_gallerySection__head">
        <h2 class="Zhang_gallerySection__title" id="Zhang_galleryTitle">图文精选</h2>
        <span class="Zhang_gallerySection__count" id="Zhang_galleryCount">加载中…</span>
      </div>

      <div class="Zhang_galleryGrid" id="Zhang_galleryGrid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="Zhang_footer">
    <span>张雪 · 24001010727 · 知乎的模仿与创作</span>
    <span class="Zhang_footer__year">2026</span>
  </footer>

  <script src="js/Zhang_canvas.js"></script>
  <script src="js/Zhang_gallery.js"></script>
</body>
</html>
